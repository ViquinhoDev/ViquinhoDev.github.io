<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ViquinhoChat · Entrada segura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Roboto', monospace;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #1a1a1a, #0a0a0a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* card principal */
        .login-container {
            background: #1e1e1e;
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 100, 0, 0.15);
            max-width: 500px;
            width: 100%;
            padding: 2rem 2rem 2rem 2rem;
            transition: all 0.2s ease;
        }

        /* cabeçalho */
        .title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF8C00, #FF5E00);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: 0.3rem;
        }

        .sub {
            text-align: center;
            color: #b0b0b0;
            font-weight: 500;
            letter-spacing: 0.3px;
            font-size: 0.9rem;
            border-bottom: 1px dashed #ff8c0033;
            display: inline-block;
            width: auto;
            margin: 0 auto 1.8rem auto;
            padding-bottom: 0.5rem;
        }

        .sub-wrapper {
            text-align: center;
        }

        .description {
            color: #cdcdcd;
            text-align: center;
            margin: 1.5rem 0 1rem 0;
            font-size: 1rem;
            background: #29292970;
            padding: 10px 16px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .code-label {
            display: block;
            font-weight: 600;
            margin: 1.5rem 0 0.5rem 0;
            color: #FF8C00;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .code-input {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1.1rem;
            background: #2c2c2c;
            border: 2px solid #3a3a3a;
            border-radius: 60px;
            color: #fff;
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .code-input:focus {
            border-color: #FF8C00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.3);
            background: #1f1f1f;
        }

        .btn-entrar {
            background: #FF8C00;
            border: none;
            width: 100%;
            padding: 1rem;
            margin-top: 1.8rem;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #111;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 0 #b45f00;
            transform: translateY(-2px);
        }

        .btn-entrar:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b45f00;
        }

        .error-msg {
            background: #ff3b301a;
            border-left: 4px solid #ff5e3a;
            padding: 12px;
            margin-top: 1.2rem;
            border-radius: 18px;
            color: #ffaa88;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* rodapé */
        footer {
            margin-top: 2.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            color: #7e7e7e;
            border-top: 1px solid #2c2c2c;
            padding-top: 1.5rem;
        }

        .copy {
            letter-spacing: 0.3px;
        }

        .dev-by {
            color: #ff9f40;
        }

        .version-badge {
            background: #2a2a2a;
            padding: 4px 10px;
            border-radius: 60px;
            font-family: monospace;
            font-weight: 500;
            color: #ffab5e;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.6rem;
            }
            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="title">ViquinhoChat</div>
    <div class="sub-wrapper">
        <div class="sub">✦ Serviço de chat privado e criptografado ✦</div>
    </div>
    <div class="description">🔐 digite seu código de entrada para acessar o taboi-chat</div>

    <div>
        <label class="code-label">CÓDIGO DE ACESSO</label>
        <input type="password" class="code-input" id="accessCode" placeholder="Ex: VQ-8A7F3D" autocomplete="off">
        <button class="btn-entrar" id="enterBtn">➤ ENTRAR</button>
        <div id="errorBox" class="error-msg"></div>
    </div>

    <footer>
        <div class="copy">© 2026 ViquinhoChat · todos os direitos reservados</div>
        <div class="dev-by">Desenvolvido por: <strong>ViquinhoDev (Vicente Bajay)</strong></div>
        <div class="version-badge" id="footerVersion">v1.6 (components/version.txt)</div>
    </footer>
</div>

<script>
    // --------------------------------------------------------------
    // FUNÇÃO: descriptografar hash (simulação reversível para validação)
    // Como o enunciado pede: ids em accounts.json estão em hash, 
    // app vai descriptografar para validar os ids no campo.
    // Aqui usamos um "hash reversível" simples (base64 + troca mock)
    // mas para efeito real, dado que é frontend, farei uma função que
    // "decodifica" um hash simples (ex: sha256 não é reversível, então
    // simulamos um cipher simétrico leve: troca de caracteres + base64)
    // PORÉM para demonstração funcional, criaremos uma função que
    // "verifica" comparando hash do código digitado com o hash salvo.
    // Mas o texto original diz: "o id está armazenado o código em hash
    // então o app vai descriptografar ai pra valida os ids no campo"
    // Vou implementar uma descriptografia reversível (ex: cifra XOR simples)
    // para que o ID digitado seja convertido e comparado com id do JSON.
    // Isso simula um hash simétrico.
    
    // Chave secreta (para demonstração, em produção use backend)
    const SECRET_KEY = "Viquinho2026Secure";
    
    // Função simples de "hash reversível" (cifra XOR + base64)
    function encryptId(plainId) {
        let encrypted = "";
        for (let i = 0; i < plainId.length; i++) {
            let charCode = plainId.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length);
            encrypted += String.fromCharCode(charCode);
        }
        return btoa(encrypted);
    }
    
    function decryptId(encryptedHash) {
        try {
            const decoded = atob(encryptedHash);
            let plain = "";
            for (let i = 0; i < decoded.length; i++) {
                let charCode = decoded.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length);
                plain += String.fromCharCode(charCode);
            }
            return plain;
        } catch(e) {
            return null;
        }
    }
    
    // Carregar accounts.json
    let accountsList = []; // array de {id, name, profile}
    
    async function loadAccounts() {
        try {
            const response = await fetch('components/accounts.json');
            if (!response.ok) throw new Error('Falha ao carregar contas');
            const data = await response.json();
            accountsList = data.accounts; // espera array com {id, name, profile}
        } catch(err) {
            console.error(err);
            document.getElementById('errorBox').innerText = 'Erro crítico: não foi possível carregar base de contas.';
            document.getElementById('errorBox').classList.add('show');
        }
    }
    
    // Carregar versions.json e redirecionar para a mais recente
    async function getLatestVersionUrl() {
        try {
            const resp = await fetch('components/versions.json');
            if (!resp.ok) throw new Error('sem versões');
            const versionsData = await resp.json();
            const latest = versionsData.versions.find(v => v.isLatest === true);
            if (!latest) throw new Error('nenhuma versão marcada como latest');
            // caminho exemplo: "versions/v1/v1.html" -> queremos URL amigável /chat/v1
            // mas o redirecionamento será para: https://viquinhodev.github.io/chat/versao
            // como descrito: "redireciona para /chat/versãomaisrecente" e "url esconde .html"
            let path = latest.htmlPath; // ex: "versions/v1/v1.html"
            let versionSlug = latest.version; // ex: "v1"
            // Monta URL: (a partir da raiz do projeto) /chat/v1 -> exibindo conteúdo do htmlPath
            // Para o redirecionamento assumimos que o site está servindo os arquivos corretamente.
            // Usaremos redirecionamento direto para o arquivo HTML, mas mantendo compatibilidade com rota amigável.
            // Para este exemplo, redirecionamos para ./ + path (montagem simples)
            // MAS o enunciado deseja URL /chat/v1 (sem .html). Sendo um app estático, faremos:
            // Redirecionar para "chat-loader.html?version=latest" não é o pedido.
            // Vou redirecionar para: ./chat/ + versionSlug   (e o servidor deverá entregar o html)
            // Como ambiente local: vou redirecionar para o arquivo diretamente com rewrite mental.
            // Para demonstração, enviamos para o htmlPath.
            return path; 
        } catch(e) {
            console.error(e);
            document.getElementById('errorBox').innerText = 'Erro ao determinar versão mais recente do chat.';
            document.getElementById('errorBox').classList.add('show');
            return null;
        }
    }
    
    // Função de validação do código: descriptografa cada hash do accounts.json e compara com código digitado.
    async function validateAndRedirect() {
        const codeInput = document.getElementById('accessCode').value.trim();
        const errorDiv = document.getElementById('errorBox');
        errorDiv.classList.remove('show');
        errorDiv.innerText = '';
        
        if (!codeInput) {
            errorDiv.innerText = '❌ Por favor, digite seu código de entrada.';
            errorDiv.classList.add('show');
            return;
        }
        
        if (accountsList.length === 0) {
            await loadAccounts();
        }
        
        // Percorre contas e tenta descriptografar cada id (hash) e comparar
        let validAccount = null;
        for (let account of accountsList) {
            const encryptedId = account.id; // hash armazenado
            const decryptedId = decryptId(encryptedId);
            if (decryptedId && decryptedId === codeInput) {
                validAccount = account;
                break;
            }
        }
        
        if (validAccount) {
            // Salva sessão simples (nome de usuário, profile)
            sessionStorage.setItem('viquinho_user', JSON.stringify({
                name: validAccount.name,
                profile: validAccount.profile,
                codigo: codeInput
            }));
            // redireciona para versão mais recente do chat
            const latestUrl = await getLatestVersionUrl();
            if (latestUrl) {
                // redirecionamento conforme espec: /chat/versão (versão mais recente) EX: v1
                // Como o caminho pode ser relativo, extraímos a versão do latestUrl.
                // Mas para seguir o princípio: "redireciona para /chat/versãomaisrecente"
                // Vamos obter a versão slug através do versions.json novamente
                try {
                    const respVer = await fetch('components/versions.json');
                    const vdata = await respVer.json();
                    const latestVer = vdata.versions.find(v => v.isLatest === true);
                    if (latestVer) {
                        const finalPath = `chat/${latestVer.version}`; // ex: chat/v1
                        // mantém caminho relativo, redireciona.
                        // Para funcionar no github pages ou servidor local, fazemos redirect para o html real.
                        // Mas mantemos a URL "amigável" com pushState? Melhor: redirecionar para o .html.
                        // Porém se o servidor tiver rota amigável, usamos. Para este exemplo, usaremos o htmlPath.
                        window.location.href = latestVer.htmlPath;
                    } else {
                        window.location.href = latestUrl;
                    }
                } catch { window.location.href = latestUrl; }
            } else {
                errorDiv.innerText = '⚠️ Não foi possível carregar o destino do chat. Contate admin.';
                errorDiv.classList.add('show');
            }
        } else {
            errorDiv.innerText = '🔒 Código inválido. Verifique e tente novamente.';
            errorDiv.classList.add('show');
            document.getElementById('accessCode').value = '';
            document.getElementById('accessCode').focus();
        }
    }
    
    // botão e enter key
    document.getElementById('enterBtn').addEventListener('click', validateAndRedirect);
    document.getElementById('accessCode').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') validateAndRedirect();
    });
    
    // pré-carregar contas
    loadAccounts();
    
    // versão no rodapé conforme solicitado (já está estático, mas pode ler version.txt)
    async function setVersionFromTxt() {
        try {
            const res = await fetch('components/version.txt');
            if (res.ok) {
                const txtVer = await res.text();
                document.getElementById('footerVersion').innerText = txtVer.trim() + ' (components/version.txt)';
            }
        } catch(e) {}
    }
    setVersionFromTxt();
</script>
</body>
</html>
