<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        .container {
            text-align: center;
            color: #FF8C00;
            padding: 2rem;
            background: #111111;
            border: 1px solid #FF8C00;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.15);
            max-width: 450px;
            width: 90%;
        }

        /* Loader suave */
        .loader {
            width: 50px;
            height: 50px;
            margin: 20px auto;
            border: 3px solid #2a2a2a;
            border-top: 3px solid #FF8C00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            font-size: 1.2rem;
            margin-top: 20px;
            color: #FF8C00;
            font-weight: 500;
        }

        .redirect-url {
            font-size: 0.95rem;
            margin-top: 12px;
            color: #FFA500;
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .countdown {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #cccccc;
        }

        .countdown span {
            font-size: 1.2rem;
            font-weight: 600;
            color: #FF8C00;
        }

        /* Link manual discreto */
        .manual-link {
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .manual-link a {
            color: #FF8C00;
            text-decoration: none;
            border-bottom: 1px dotted #FF8C00;
            transition: opacity 0.2s;
        }

        .manual-link a:hover {
            opacity: 0.8;
        }

        /* Texto de loading opcional */
        .loading-text {
            font-size: 0.8rem;
            color: #888888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <div class="message">Redirecionando para o chat</div>
        <div class="redirect-url">viquinhodev.github.io/chat</div>
        <div class="countdown">Aguarde <span id="timer">3</span> segundos</div>
        <div class="manual-link">
            <a href="chat.html" id="manualRedirect">Clique aqui se não redirecionar automaticamente</a>
        </div>
        <div class="loading-text">Carregando...</div>
    </div>

    <script>
        let timeLeft = 3;
        const timerElement = document.getElementById('timer');
        const manualLink = document.getElementById('manualRedirect');
        
        // Função para redirecionar
        function redirectToChat() {
            window.location.href = 'chat.html';
        }

        // Prevenir que o link padrão execute o redirecionamento duplo
        manualLink.addEventListener('click', function(e) {
            e.preventDefault();
            redirectToChat();
        });

        // Timer regressivo
        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timerElement) {
                timerElement.textContent = timeLeft;
            }
            
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                redirectToChat();
            }
        }, 1000);

        // Tentar manter a URL amigável no histórico (opcional)
        if (window.history && window.history.replaceState) {
            const desiredUrl = window.location.origin + '/chat';
            window.history.replaceState({}, '', desiredUrl);
        }

        // Pequeno delay inicial opcional
        setTimeout(() => {
            console.log('Redirecionando para viquinhodev.github.io/chat');
        }, 100);
    </script>
</body>
</html>
